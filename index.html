<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>My Tasks</h1>
      <button id="themeToggleBtn" aria-label="Toggle Dark Mode">🌙</button>
    </header>

    <!-- Search & Filters -->
    <div class="search-filter-section">
      <input type="text" id="searchInput" placeholder="🔍 Search tasks..." />
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
    </div>

    <!-- Task Form -->
    <form id="taskForm">
      <div class="input-group">
        <input type="text" id="taskInput" placeholder="What needs to be done?" />
        <select id="prioritySelect">
          <option value="Low">Low</option>
          <option value="Medium" selected>Medium</option>
          <option value="High">High</option>
        </select>
        <input type="date" id="dueDateInput" />
        <button type="submit" id="submitTaskBtn">Add Task</button>
      </div>
      <p id="errorMessage" class="error-msg"></p>
    </form>

    <!-- Task Counters / Stats -->
    <div class="task-stats">
      <span>Pending: <strong id="pendingCount">0</strong></span>
      <span>Completed: <strong id="completedCount">0</strong></span>
    </div>

    <!-- Task List -->
    <ul id="taskList" class="task-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
